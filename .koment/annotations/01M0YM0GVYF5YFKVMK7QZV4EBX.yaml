spec:
  target:
    file: VERSION
  type: why
  title: One semver for the whole batch, never per skill
  body: |-
    The requirement this repository was created to satisfy is "one batch version
    plus one sha". Per-skill versions would defeat it: a consumer would have to
    pin seven strings and reason about which combination it had ever tested
    together.

    One number covers the whole set, so "which skills is this cluster running"
    has a single answer, and a release is a set that was proven to load together
    in all three harnesses rather than an arbitrary mix of
    independently-versioned parts.

    Adding, removing or editing any skill bumps this file. Upstream provenance
    for the individual skills lives in agent-kit.lock.json, which is where
    per-skill drift is tracked without turning it into a version a consumer must
    pin.
